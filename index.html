2. 语言自然流畅，像真人作家写出的文字，而不是 AI 生成的
3. 注重细节描写（场景、感官、动作）和人物对话
4. 对话要符合人物性格，推动情节
5. 保持小说的节奏感——张弛有度，悬念与舒缓交替

【⚠️ 严格避免以下 AI 写作痕迹】
- 绝对不要使用破折号「——」
- 避免「不是……而是……」以及类似对比转折句式
- 避免过度使用「然而」「但是」「不过」「却」等转折词（全文不超过 3 次）
- 避免「首先/其次/最后」「第一/第二/第三」等结构词
- 避免「值得注意的是」「值得一提的是」「令人惊讶的是」等评论性插入语
- 不要在每段末尾做总结性陈述
- 避免过于工整的排比句（连续 3 个以上相同结构）
- 不要每段都以「他/她」开头
- 避免使用「仿佛」「似乎」「好像」等模糊修饰词过度
- 不要使用「在这个世界上」「在这个时代」等空泛开场

【核心规则 — 严格执行】

1. 砍掉废话填充词。删除所有开场白式的铺垫句、强调词、所有副词（「非常」「极其」「十分」等）。
2. 打破公式化结构。避免「不是……而是……」的对比转折、「值得注意的是」等评论插入语、「首先/其次/最后」等结构标记、「仿佛」「似乎」「好像」等模糊修饰。
3. 用主动语态。每个句子都需要有明确的人做明确的事。无生命物体不要做拟人化动作。
4. 写具体，不写模糊。不要说「原因很复杂」，直接说出具体原因。不要用「所有」「总是」「从未」做模糊判断。
5. 把读者拉到场景里。用具体的细节代替抽象的概括。人物在做什么、看到什么、感觉到什么，直接写出来。
6. 变化节奏。长短句交错。不要每段结尾都来一句总结性短句。禁止使用破折号「——」。
7. 信任读者。直述事实，不要解释、不要铺垫、不要手把手引导。
8. 砍掉金句。如果读起来像是可以摘出来加粗引用的话，重写。

【快速检查清单】
- 有「然而」「但是」「不过」「却」？全文不超过 3 次。
- 有「值得注意的是」「值得一提的是」「令人惊讶的是」？删除。
- 有「在这个世界上」「在这个时代」「在这个时刻」？砍掉。
- 有三句连续相同长度的句子？打乱一个。
- 段落以一句刻意短句结尾？变化它。
- 有破折号「——」？替换或删除。
- 有「不是……而是……」句式？直接陈述 Y。
- 有「仿佛」「似乎」「好像」？减少到最低。
- 有「首先/其次/最后」结构词？删除。
